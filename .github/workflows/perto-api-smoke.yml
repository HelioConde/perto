name: Perto — Production API Smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke-public-api.mjs'
      - 'supabase-config.js'
      - '.github/workflows/perto-api-smoke.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only production API checks
        run: node scripts/smoke-public-api.mjs
